<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Homeo-Ocaus: Advanced Homeopathic Clinic Management System.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Homeo-Ocaus">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Homeo-Ocaus | Clinic Management</title>
  <link rel="manifest" href="manifest.json">

  <!-- Google Sign-In Client ID -->
  <meta name="google-signin-client_id" content="807016590624-hn1q66jgl400f2o7josrkvjts44pgesk.apps.googleusercontent.com">

  <style>
    body {
      background-color: #F1F8E9;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loader {
      border: 6px solid #DCEDC8;
      border-top: 6px solid #1B5E20;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      color: #1B5E20;
      font-weight: bold;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="loader"></div>
    <div class="loading-text">INITIALIZING HOMEO-OCAUS...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    window.addEventListener('load', function() {
      // Remove loading indicator once Flutter is ready
      var loadingIndicator = document.getElementById('loading-indicator');
      if (loadingIndicator) {
        // Flutter usually takes over the body, but this is a safety net
        setTimeout(function() {
          if (document.body.contains(loadingIndicator)) {
            loadingIndicator.style.display = 'none';
          }
        }, 3000);
      }
    });
  </script>
</body>
</html>
